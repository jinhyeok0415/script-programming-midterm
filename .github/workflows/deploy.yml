# GitHub Pages 배포: main 브랜치에 푸시하면 빌드(npm run build)한 결과(dist)를 배포한다.
# 이 앱은 인증키를 소스·빌드에 넣지 않고 접속자가 화면에서 직접 입력하므로, 배포에 필요한 비밀값(Secrets)이 없다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

# 같은 브랜치에서 배포가 겹치면 이전 실행을 취소하고 마지막 것만 배포한다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # Vite 8 은 Node ^20.19 또는 22.12 이상이 필요하다
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
